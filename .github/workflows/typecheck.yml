name: Type Check

# Guards against schema-drift regressions: the Supabase client is typed against
# the live DB schema, and this gate fails if the TypeScript error count rises
# above the committed baseline (.typecheck-baseline). See scripts/typecheck-ratchet.mjs.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/typecheck-ratchet.mjs
